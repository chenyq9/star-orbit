<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>Star Orbit · 教学关卡 v1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06060f;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:14px;left:0;right:0;text-align:center;color:rgba(180,200,255,.6);font-size:12px;letter-spacing:1px;pointer-events:none;z-index:10;padding:0 60px}
#nav{position:fixed;top:10px;right:14px;color:rgba(180,200,255,.6);font-size:20px;z-index:15;cursor:pointer;user-select:none}
#prev{position:fixed;top:10px;left:14px;color:rgba(180,200,255,.6);font-size:20px;z-index:15;cursor:pointer;user-select:none}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(6,6,15,.85);color:#dfe8ff;z-index:20;letter-spacing:3px;cursor:pointer}
#win h2{font-size:26px;margin-bottom:10px}
#win p{font-size:14px;color:rgba(180,200,255,.7)}
</style>
</head>
<body>
<canvas id='c'></canvas>
<div id='hud'></div>
<div id='prev'>‹</div>
<div id='nav'>›</div>
<div id='win'><h2>轨道归位 ✔</h2><p>点击进入下一关</p></div>
<script>
/* Star Orbit 教学关卡 v1
   基于骨架 v0.1 引擎 + levels-v1.md 验证过的关卡配置
   关卡数据与 BFS 验证脚本同源 */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,cx,cy,R,lx,rx,gy,stars=[];
const SLOTS=12,STEP=30;
const COLORS={b:{fill:'#4a9eff',rgb:'74,158,255'},o:{fill:'#ff9a3c',rgb:'255,154,60'}};
function gatePartner(c,s){
  if(c===0){if(s===10)return 8;if(s===2)return 4;return null;}
  if(s===8)return 10;if(s===4)return 2;return null;
}
const LEVELS=[
  {name:'第1关 · 启程', hint:'拖动蓝色轨道，让行星沿轨道前进',   balls:[{color:'b',pos:[0,null]}], targets:[{ring:0,slot:3,color:'b'}]},
  {name:'第2关 · 引力窗口', hint:'轨道相交处是引力窗口，行星可以借机换轨',   balls:[{color:'b',pos:[5,null]}], targets:[{ring:1,slot:5,color:'b'}]},
  {name:'第3关 · 双星协奏', hint:'两颗星都要归位，先想好顺序',   balls:[{color:'b',pos:[0,null]},{color:'o',pos:[null,0]}], targets:[{ring:1,slot:0,color:'b'},{ring:0,slot:0,color:'o'}]},
  {name:'第4关 · 弧的抉择', hint:'去往另一条轨道，不一定走最近的窗口',   balls:[{color:'b',pos:[4,null]}], targets:[{ring:1,slot:4,color:'b'}]},
  {name:'第5关 · 交叉航线', hint:'两颗星都要换轨，注意它们会互相牵动',   balls:[{color:'b',pos:[3,null]},{color:'o',pos:[null,9]}], targets:[{ring:1,slot:9,color:'b'},{ring:0,slot:3,color:'o'}]},
  {name:'第6关 · 轨道合流', hint:'综合运用前面所学',   balls:[{color:'b',pos:[6,null]},{color:'o',pos:[null,0]}], targets:[{ring:1,slot:6,color:'b'},{ring:0,slot:0,color:'o'}]}
];
let lvlIdx=0,balls,targets,steps,won,drag=null,visual=0;
function resize(){
  const dpr=window.devicePixelRatio||1;  W=innerWidth;H=innerHeight;  cv.width=W*dpr;cv.height=H*dpr;  cv.style.width=W+'px';cv.style.height=H+'px';  ctx.setTransform(dpr,0,0,dpr,0,0);  cx=W/2;cy=H/2;  R=Math.min(W*0.44,H*0.28);  lx=cx-R/2;rx=cx+R/2;  gy=Math.sqrt(3)/2*R;  stars=[];  for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.4+.15});}
addEventListener('resize',()=>{resize();});resize();
function loadLevel(i){  lvlIdx=((i%LEVELS.length)+LEVELS.length)%LEVELS.length;  const L=LEVELS[lvlIdx];  balls=L.balls.map(b=>({color:b.color,pos:b.pos.slice()}));  targets=L.targets;  steps=0;won=false;drag=null;visual=0;  document.getElementById('win').style.display='none';  updateHud();}function updateHud(){  const L=LEVELS[lvlIdx];  document.getElementById('hud').innerHTML=L.name+' · '+L.hint+' · 步数 <b>'+steps+'</b>';}function simStep(ci,dir){  const sim=balls.map(b=>b.pos.slice());  for(const p of sim){if(p[ci]!==null)p[ci]=(p[ci]+dir+SLOTS)%SLOTS;}  for(const p of sim){    if(p[ci]===null)continue;    const o=1-ci,g=gatePartner(ci,p[ci]);    p[o]=(g!==null)?g:null;  }  return sim;}function hasDup(sim){  for(let c=0;c<2;c++){    const seen=new Set();    for(const p of sim){if(p[c]===null)continue;if(seen.has(p[c]))return true;seen.add(p[c]);}  }  return false;}function applyStepCore(ci,dir){  const sim=simStep(ci,dir);  balls.forEach((b,i)=>b.pos=sim[i]);  steps++;updateHud();checkWin();}function checkWin(){  for(const t of targets){    if(!balls.some(b=>b.color===t.color&&b.pos[t.ring]===t.slot))return;  }  won=true;  document.getElementById('win').style.display='flex';}function ringXY(c){return c===0?lx:rx;}function slotXY(c,s){const a=s*STEP*Math.PI/180;return[ringXY(c)+R*Math.cos(a),cy+R*Math.sin(a)];}function ballXY(b){for(let c=0;c<2;c++)if(b.pos[c]!==null)return slotXY(c,b.pos[c]);return null;}function drawBall(x,y,color,alpha,isInt){  const r=R*.055,col=COLORS[color].fill,rgb=COLORS[color].rgb;  ctx.globalAlpha=alpha;  const g=ctx.createRadialGradient(x,y,0,x,y,r*2.2);  g.addColorStop(0,'rgba('+rgb+',.3)');g.addColorStop(1,'rgba('+rgb+',0)');  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.2,0,7);ctx.fill();  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=col;ctx.fill();  ctx.beginPath();ctx.arc(x-r*.28,y-r*.28,r*.3,0,7);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill();  if(isInt){ctx.beginPath();ctx.arc(x,y,r*1.5,0,7);ctx.strokeStyle='rgba(208,168,255,.75)';ctx.lineWidth=1.5;ctx.stroke();}  ctx.globalAlpha=1;}function draw(){  ctx.fillStyle='#06060f';ctx.fillRect(0,0,W,H);  for(const s of stars){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fillStyle='rgba(200,220,255,'+s.a+')';ctx.fill();}  for(let c=0;c<2;c++){    const active=drag&&drag.ci===c;    ctx.beginPath();ctx.arc(ringXY(c),cy,R,0,7);    ctx.strokeStyle=active?'rgba(255,255,255,.85)':'rgba('+(c===0?'74,158,255':'255,154,60')+',.45)';    ctx.lineWidth=active?3:2;ctx.stroke();    for(let i=0;i<SLOTS;i++){      const[x,y]=slotXY(c,i);      ctx.beginPath();ctx.arc(x,y,2,0,7);      ctx.fillStyle='rgba('+(c===0?'74,158,255':'255,154,60')+',.25)';ctx.fill();    }  }  [[cx,cy-gy],[cx,cy+gy]].forEach(([x,y])=>{    ctx.beginPath();ctx.arc(x,y,R*.08,0,7);    ctx.strokeStyle='rgba(208,168,255,.3)';ctx.lineWidth=1.5;ctx.stroke();  });  for(const t of targets){    const[x,y]=slotXY(t.ring,t.slot);    ctx.setLineDash([4,4]);    ctx.beginPath();ctx.arc(x,y,R*.055,0,7);    ctx.strokeStyle=COLORS[t.color].fill;ctx.lineWidth=2;ctx.stroke();    ctx.setLineDash([]);    ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fillStyle=COLORS[t.color].fill+'99';ctx.fill();  }  for(const b of balls){    const[x,y]=ballXY(b);if(x===undefined)continue;    const isInt=b.pos[0]!==null&&b.pos[1]!==null;    const moving=drag&&b.pos[drag.ci]!==null;    const alpha=(drag&&!moving)?0.4:1;    drawBall(x,y,b.color,alpha,isInt);  }}cv.addEventListener('pointerdown',e=>{  if(won)return;  const rct=cv.getBoundingClientRect();  const px=e.clientX-rct.left,py=e.clientY-rct.top;  const dL=Math.abs(Math.hypot(px-lx,py-cy)-R),dR2=Math.abs(Math.hypot(px-rx,py-cy)-R);  let ci=null;  if(dL<R*.7&&dL<=dR2)ci=0;else if(dR2<R*.7)ci=1;  if(ci===null)return;  drag={ci,last:Math.atan2(py-cy,px-ringXY(ci))*180/Math.PI,accum:0,applied:0,id:e.pointerId};  cv.setPointerCapture(e.pointerId);});cv.addEventListener('pointermove',e=>{  if(!drag||e.pointerId!==drag.id)return;  if(won){drag=null;visual=0;return;}  const rct=cv.getBoundingClientRect();  const px=e.clientX-rct.left,py=e.clientY-rct.top;  let a=Math.atan2(py-cy,px-ringXY(drag.ci))*180/Math.PI;  let d=a-drag.last;while(d>180)d-=360;while(d<-180)d+=360;  drag.accum+=d;drag.last=a;  let want=Math.trunc(drag.accum/STEP);  while(drag.applied<want){    if(!hasDup(simStep(drag.ci,1))){applyStepCore(drag.ci,1);drag.applied++;}    else{drag.accum=drag.applied*STEP+(STEP-.01);break;}  }  while(drag.applied>want){    if(!hasDup(simStep(drag.ci,-1))){applyStepCore(drag.ci,-1);drag.applied--;}    else{drag.accum=drag.applied*STEP-(STEP-.01);break;}  }  visual=(drag.accum-drag.applied*STEP)/STEP;});function up(e){  if(!drag||e.pointerId!==drag.id)return;  if(!won){    if(visual>=0.5){if(!hasDup(simStep(drag.ci,1)))applyStepCore(drag.ci,1);}    else if(visual<=-0.5){if(!hasDup(simStep(drag.ci,-1)))applyStepCore(drag.ci,-1);}  }  visual=0;drag=null;}cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);document.getElementById('nav').addEventListener('click',()=>loadLevel(lvlIdx+1));document.getElementById('prev').addEventListener('click',()=>loadLevel(lvlIdx-1));document.getElementById('win').addEventListener('click',()=>{loadLevel(lvlIdx+1);});loadLevel(0);(function loop(){draw();requestAnimationFrame(loop);})();</script></body></html>
